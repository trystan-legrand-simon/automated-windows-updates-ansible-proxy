[windows]
windows-client-1

[windows:vars]
ansible_connection=winrm
ansible_host=192.168.0.20
ansible_user="Client 1"
# Do not commit passwords. Set ANSIBLE_WINRM_PASSWORD in the local environment.
ansible_password="{{ lookup('env', 'ANSIBLE_WINRM_PASSWORD') }}"
ansible_winrm_transport=ntlm
# Example lab-only HTTP transport: protect WinRM traffic, prefer HTTPS 5986.
ansible_winrm_port=5985
ansible_winrm_scheme=http
